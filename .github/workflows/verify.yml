name: verify

on:
  pull_request:
    branches: [main, v2]
  push:
    branches: [main, v2]

# Cancel earlier runs on the same branch when a new push lands.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # NOTE: this `name:` is a required-status-check context in main's branch
    # protection — keep it STABLE. Describe added checks in step names (below),
    # not here; renaming this string silently blocks every PR until protection
    # is updated in lockstep.
    name: invariants (canvases + tool groups)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2
        with:
          just-version: '1.36.0'

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      # Static schema check on the plugin itself: manifest fields, component
      # frontmatter, hook/MCP config shape. Catches the class of bug where a
      # component is declared under a field Claude Code silently ignores at
      # load time (e.g. the pre-0.2.23 `components` wrapper, which no-op'd the
      # three browser MCP servers for every consumer). Needs no credentials —
      # it is a pure local parse. Pinned like every other tool here; bump
      # deliberately when adopting new manifest schema.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.226

      - name: Validate plugin manifest + components
        run: claude plugin validate ./plugin

      - name: Verify tool groups
        run: just sdlc::verify-tool-groups

      - name: Verify teammate tools
        run: just sdlc::verify-teammate-tools

      - name: Verify canvases
        run: just sdlc::verify-canvases

      - name: Verify worktree hooks
        run: just sdlc::verify-worktree-hooks

      - name: List canvases (informational)
        run: just sdlc::canvases

  version-bump:
    name: plugin/ changes require version bump
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version bump
        run: bash plugin/scripts/verify-version-bump.sh

  tools-typecheck:
    name: tools/* typecheck
    runs-on: ubuntu-latest
    # Cheap PR feedback — doesn't compile binaries (that's release.yml on tags).
    # Discovers tools from plugin/lib/tools.json so adding a tool requires
    # zero workflow edits.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Typecheck each tool source_dir
        run: |
          set -e
          for dir in $(jq -r '.tools[] | .source_dir' plugin/lib/tools.json); do
            echo "::group::typecheck $dir"
            (cd "$dir" && bun install --frozen-lockfile && bun run typecheck)
            echo "::endgroup::"
          done
