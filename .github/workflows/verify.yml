name: verify

on:
  pull_request:
    branches: [main, v2]
  push:
    branches: [main, v2]

# Cancel earlier runs on the same branch when a new push lands.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: invariants (canvases + tool groups)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2
        with:
          just-version: '1.36.0'

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Verify tool groups
        run: just verify-tool-groups

      - name: Verify canvases
        run: just verify-canvases

      - name: List canvases (informational)
        run: just canvases
