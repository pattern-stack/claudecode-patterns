name: plugin-drift-test

on:
  pull_request:
    branches: [main, v2]
  push:
    branches: [main, v2]

concurrency:
  group: drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-smoke:
    name: fresh-project install smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2
        with:
          just-version: '1.36.0'

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Validate plugin manifest exists and parses
        run: |
          test -f plugin/.claude-plugin/plugin.json
          test -f .claude-plugin/marketplace.json
          jq empty plugin/.claude-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json
          echo "✅ plugin.json + marketplace.json valid JSON"

      - name: Validate plugin structure
        run: |
          set -e
          for d in skills agents commands canvases primitives output-styles hooks scripts; do
            test -d plugin/$d || { echo "❌ Missing plugin/$d"; exit 1; }
          done
          test -f plugin/sdlc.justfile
          test -f plugin/sdlc.example.yml
          echo "✅ Plugin structure complete"

      - name: Validate hooks.json commands all reference existing scripts
        run: |
          set -euo pipefail
          # Hooks live in plugin/hooks/hooks.json (the plugin's DEFAULT hook-config
          # location) — not in plugin.json. Commands reference scripts as
          # `${CLAUDE_PLUGIN_ROOT}/<path>`; extract each path and assert it exists.
          #
          # This check previously read `.components.hooks` out of plugin.json with
          # `${CLAUDE_PLUGIN_DIR}` — wrong file AND wrong variable — so it matched
          # nothing and passed vacuously for its whole life. Keep it honest: the
          # count assertion below fails loudly if the extraction ever goes empty.
          jq -r '.hooks | to_entries[] | .value[].hooks[].command' plugin/hooks/hooks.json \
            | grep -oE '\$\{CLAUDE_PLUGIN_ROOT\}/[^ ]+' \
            | sed 's|${CLAUDE_PLUGIN_ROOT}/||' \
            | sort -u > /tmp/hook-scripts.txt

          count=$(wc -l < /tmp/hook-scripts.txt | tr -d ' ')
          test "$count" -gt 0 || { echo "❌ Extracted 0 hook script paths — the check is broken, not the hooks"; exit 1; }

          missing=0
          while read -r p; do
            [ -n "$p" ] || continue
            test -f "plugin/$p" || { echo "❌ Missing plugin/$p (referenced in hooks.json)"; missing=1; }
          done < /tmp/hook-scripts.txt
          test "$missing" -eq 0 || exit 1
          echo "✅ All $count hook scripts present"

      - name: Simulate fresh-project install (cp plugin → ~/.claude/plugins/sdlc)
        run: |
          set -e
          mkdir -p ~/.claude/plugins/sdlc
          cp -r plugin/. ~/.claude/plugins/sdlc/
          # Simulate user-project minimal install
          mkdir -p /tmp/fresh-project/.claude
          cp plugin/sdlc.example.yml /tmp/fresh-project/.claude/sdlc.yml
          # Replace placeholders with valid values
          sed -i 's|repo: <owner>/<repo>|repo: pattern-stack/claudecode-patterns|' /tmp/fresh-project/.claude/sdlc.yml
          # Symlink plugin location for the .claude/sdlc.justfile resolver
          ln -sf ~/.claude/plugins/sdlc/sdlc.justfile /tmp/fresh-project/.claude/sdlc.justfile
          # Simulate the project-level Justfile that /sdlc:setup would create
          cat > /tmp/fresh-project/Justfile <<'JF'
          default:
              @just --list

          mod sdlc '.claude/sdlc.justfile'
          JF
          echo "✅ Fresh-project layout assembled"

      - name: Run sdlc::verify in fresh project (drift smoke)
        working-directory: /tmp/fresh-project
        env:
          CLAUDE_PLUGIN_DIR: /home/runner/.claude/plugins/sdlc
        run: |
          # Verify the plugin's verifiers run correctly against a minimal project
          # config. This catches broken paths in agent prompts AND in scripts after
          # the plugin restructure.
          just sdlc::verify
          echo "✅ Fresh-project install passes verifiers"
