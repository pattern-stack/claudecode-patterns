# Plan artifact — tunable knobs for the planner producer and downstream consumers.
# Schema: instructions.schema.json (validate with ajv-cli or any JSON Schema validator).
# Field identifiers below MUST match the placeholders in template.md verbatim.

$schema: ./instructions.schema.json
artifact: plan
version: 1

# ─── Plan-level fields ─────────────────────────────────────────────────
plan:
  required_fields:
    - slug
    - summary
    - milestone
    - epic_title
    - epic_body

  optional_fields:
    - repo                          # cross-repo flag; defaults to sdlc.yml.repo
    - stack                         # { base, depends_on } — st topology metadata

  # Epic body length budget (parent issue body).
  epic_body_max_chars: 3000

  # Epic body verbosity hint — producer adapts content depth.
  epic_body_verbosity: medium       # short | medium | long

# ─── Per-issue fields ──────────────────────────────────────────────────
issue:
  required_fields:
    - key
    - title
    - description

  optional_fields:
    - layer                         # L0..L7; sets project Layer custom field
    - milestone                     # override; defaults to plan.milestone
    - depends_on                    # blocking relation via port op set-blocking
    - parallel_with                 # informational
    - labels                        # extra labels (needs:* etc.); state:* NOT set here

  # Description verbosity per issue.
  description_verbosity: medium     # short | medium | long
  description_max_lines: 8          # cap to keep PR-sized issues skimmable
  include_acceptance: true          # description ends with "Acceptance:" block

# ─── Sizing guidance ──────────────────────────────────────────────────
# Plans violating these get warnings during /plan iteration, not hard failures.
sizing:
  max_issues_per_stack: 8           # if > 8, prompt user to split into multiple stacks
  min_issues_per_stack: 2           # < 2 may not warrant its own epic
  max_critical_path_depth: 12       # if longer, plan may be too monolithic

# ─── Layer enumeration ────────────────────────────────────────────────
# Constrains issue.layer; the GitHub adapter sets project's Layer single-select field.
layer:
  enum: [L0, L1, L2, L3, L4, L5, L6, L7]
  default: null

# ─── Dependency rules ─────────────────────────────────────────────────
dependencies:
  cycle_detection: true             # /sync-issues halts on cycles before any tracker call
  cross_stack_via: depends_on_slug  # informational; future cross-stack dep mechanism

# ─── Idempotence markers ─────────────────────────────────────────────
# /sync-issues uses these via the port operation find-by-marker.
markers:
  epic: "[plan-epic:{{plan.slug}}]"
  leaf: "[plan-key:{{plan.slug}}/{{issue.key}}]"
