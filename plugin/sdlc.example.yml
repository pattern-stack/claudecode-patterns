# sdlc.example.yml — copy this to your project's `.claude/sdlc.yml` and adjust.
#
# Run `/sdlc:setup` (after `/plugin install sdlc`) to render this interactively
# instead of editing by hand — the command asks the four primitive questions
# (language, quality_profile, task_management, team_key) and writes the result.
#
# All SDLC agents (planner, specifier, implementer, validator, coordinator,
# understander) and commands read from this file. Don't hardcode tracker /
# language / quality specifics in agents — declare them here.
#
# Plugin contents live at ${CLAUDE_PLUGIN_DIR} after install. Project-level
# overrides (this file, plus optional `.claude/canvases/<name>/` and
# `.claude/primitives/<cat>/<name>.md`) take precedence over the plugin
# defaults via project-first / plugin-fallback resolution in agent prompts.

# === Primitives ===
# Each value resolves to a primitive file: project `.claude/primitives/<cat>/<value>.md`
# wins; falls back to plugin `${CLAUDE_PLUGIN_DIR}/primitives/<cat>/<value>.md`.

language: typescript          # typescript | python | go
quality_profile: strict       # strict | fast
commit_style: conventional    # conventional | freeform
task_management: github       # linear | github | jira

# Adapter-specific config:
#   github → set `repo:` (required) and optionally `project_number:` (the
#            discover-tracker SessionStart hook auto-loads field IDs)
#   linear → set `team_key:` (required)
repo: <owner>/<repo>          # GitHub repo for /sync-issues (required when task_management: github)
# project_number: <n>         # OPTIONAL: GitHub Project v2 number; auto-discovered at SessionStart by plugin/scripts/discover-tracker.sh
team_key: ABC                 # tracker team key (Linear; harmless under github)

# === Image posting (beta — design-loop port) ===
# How agents attach screenshots / diagrams to comment surfaces. Orthogonal to
# task_management — a project may be on Linear but post images via GitHub PR
# comments. Defaults: `gh` if task_management is github, else `local-folder`.
#
# Adapters: plugin/primitives/image-posting/<value>.md
#   gh            — Playwright-driven upload via GitHub's composer; works on
#                   private repos via session cookies. Requires one-time:
#                   `node ${CLAUDE_PLUGIN_DIR}/scripts/gh-attach-image.mjs --auth`
#   local-folder  — writes comment markdown + images to a local dir (v1.1)
#   linear-comment — Linear's attachment API (v2)
image_posting: gh             # gh | local-folder | linear-comment (future)

# === Gate-1 mode ===
# strict: specifier posts strategy + sets state:awaiting-strategy-review + halts (default; safest).
# auto:   specifier posts strategy + sets state:strategy-approved directly (no human Gate-1 review).
# Override per-stack via plan.yaml `auto_approve: true`. Override per-issue via
# `gate:auto` / `gate:human` labels (always wins; resolution timing: /sync-issues
# stamps gate:* labels at issue-creation by reading plan.yaml.auto_approve).
gate1_default: strict         # strict | auto

# === Gate mode — umbrella for cross-gate behavior ===
# Governs Gate 2 (PR review) + Gate 3 (validate) target. Gate 1's strict/auto
# choice is still resolved per gate1_default + labels above; gate_mode is the
# outer envelope deciding what happens AFTER strategy approval.
#
# interactive (default): implementer opens a PR; validator posts to the PR;
#                        Gate 2 is a human PR review before merge.
# auto-all:              implementer commits + pushes (no PR); validator posts
#                        to the tracker issue; Gate 2 is skipped — humans review
#                        merged branches asynchronously. Best for AFK batch
#                        execution where the human reviews many branches at
#                        once, not per-PR.
#
# Compose with gate1_default to express the full matrix:
#   gate_mode: interactive + gate1_default: strict → fully gated, conservative default
#   gate_mode: interactive + gate1_default: auto   → auto-strategy, human PR review
#   gate_mode: auto-all    + gate1_default: strict → human-approved strategy, batch-merged
#   gate_mode: auto-all    + gate1_default: auto   → fully autonomous loop, human reviews after the fact
gate_mode: interactive        # interactive | auto-all

# Per-mode behavior. Agents read these directly; do NOT branch on `gate_mode`
# in agent prompts — branch on the per-mode flags instead, so new modes can
# ship by extending this block without touching agents.
modes:
  interactive:
    pr_required: true              # implementer opens a PR after push
    validator_post_target: pr      # validator posts the report to the PR
    branch_via: any                # any branch-creation path (gh, st, git)
  auto-all:
    pr_required: false             # implementer pushes; no PR
    validator_post_target: tracker # validator posts the report to the issue
    branch_via: st                 # st-managed only — keeps the stack inspectable

# === Topology A — /develop base roster ===
# Per-issue extras come from `needs:*` labels on the issue (e.g. needs:browser-pilot).
develop_team:
  - implementer
  - validator

# === Per-phase spawn tuning (model / effort / turns / worktree) ===
# Optional. Tunes HOW each phase agent is spawned, per-project, from config —
# no forked agent definitions. Keys are agent role names as they appear in
# `subagent_type` / rosters, minus any `sdlc:` prefix (`implementer`, not
# `sdlc:implementer`). A role not listed keeps its shipped frontmatter default.
#
# HOW IT'S APPLIED — deterministic, not prose:
#   The `phase-tuning` PreToolUse hook (plugin/hooks/phase-tuning.sh) intercepts
#   every `Agent` / `TeamCreate` call, reads THIS file, and rewrites the spawn
#   arguments before the tool runs. It fires regardless of whether any command's
#   markdown remembered to apply the override — the model is out of the loop.
#
#   Precedence: an argument the spawner set EXPLICITLY always wins; the hook only
#   fills a key left unset. Un-configured roles are untouched → frontmatter
#   default stands. So the blocks below ship commented = zero behavior change.
#
#   (Earlier versions — 0.2.17 — did this as prose in each command telling the
#   model to read `phase_models` and pass `model:`. That was soft; the hook is
#   the deterministic successor. The prose now just points at the hook.)
#
# Knobs per role, and how proven each is:
#   model     → spawn `model`      (proven: Agent accepts + honors it)
#   effort     → spawn `effort`     (low|medium|high|xhigh|max; accepted at spawn
#                                    2026-07-03, honoring unproven — treat as beta)
#   max_turns  → spawn `maxTurns`   (integer; hard turn cap / runaway guard)
#   worktree   → spawn `isolation:"worktree"` (proven channel; see `worktree:` below)
#
# Group every knob for a role together under `phases.<role>` — strongest model +
# effort where judgment lives, cheaper/capped for mechanical phases. Uncomment to
# use; block-map or inline-map form both work.
#
# The block below RESTATES the shipped frontmatter defaults, so
# uncommenting it as-is is a no-op — it's here as a starting point to edit, and as
# the one place the whole per-role policy is legible at a glance:
#
#   opus  where the judgment is open-ended (understander research, coordinator
#         routing, implementer code-writing)
#   fable where the work is authoring/critique against a known frame (planner,
#         specifier, reviewer) or mechanical gate-running (validator)
#
# phases:
#   understander:
#     model:  opus
#     effort: xhigh
#   planner:   { model: fable, effort: xhigh }
#   specifier: { model: fable, effort: xhigh }
#   reviewer:  { model: fable, effort: xhigh }
#   implementer:
#     model:     opus
#     effort:    low           # cheap-but-strong; raise max_turns if it under-converges
#     max_turns: 60
#     worktree:  true          # per-role isolation; ADDS only, explicit spawn arg wins
#   validator:
#     model:     fable
#     effort:    medium
#     max_turns: 40
#   coordinator:
#     model:  opus
#     effort: high
#
# NOTE: `/orchestrate`'s LEAD is your own main session, not a spawned agent — it has
# no role key here and is not reachable by the hook. Set it with `/model`.
#
# Backward-compat: the flat 0.2.17 keys `phase_models:` / `phase_effort:` /
# `phase_max_turns:` / `phase_worktree:` (each a `<role>: <value>` map) are still
# honored as a fallback. A grouped `phases.<role>.<knob>` wins over its flat twin.

# === Loop iteration caps + Gate-1 timeout ===
# Consumed by the coordinator-driven impl⇄val loop (issue #44 wires these in).
# Today they are dormant — no agent reads them yet — but they ship now so the
# coordinator PR is a pure-behavior change with no contract drift.

validator_max_iterations: 3
# Maximum impl⇄val loop iterations before coordinator halts with
# `status: halted`, `next.command: null`. Cap-hit is NOT a failure — it's
# a structured halt that surfaces full context to the human. See port
# README §"Cap-hit halts".

spec_critic_max_iterations: 3
# Maximum design ↔ critique cycles before Gate 1.5 halts with a structured
# error. Cap-hit means the spec keeps failing critique — surface to the human
# rather than spinning. Same cap-hit semantics as validator_max_iterations.

# === Spec storage ===
# file (default): full content lives in the spec file; tracker comments are
#                 ≤15-line status envelopes pointing to the file. Recommended
#                 for any spec > 50 lines and for phase-aware workflows
#                 (critique → addendum → review etc. accumulate cleanly).
# inline: full content posted as tracker comments. Legacy mode; suitable for
#         very small specs and trackers without good file/link affordances.
# both:   content in both surfaces. Double the write cost; use sparingly.
#
# The spec canvas's `tracker_comment.mode` knob defaults track this value
# (file → status_envelope; inline → full_content; both → full_content).
spec_storage: file            # file | inline | both

# === Epic status cascade ===
# When SDLC agents (implementer, validator) move a child issue's status, they
# also update the parent epic's status per the rules below. Idempotent.
# Disable when the team uses tracker-side automations (e.g. GitHub Projects)
# for status moves; humans manage epic state manually in that case.
epic_cascade:
  enabled: true
  on_first_child_in_progress: true   # Backlog/Ready → In Progress on first child move
  on_last_child_in_review: true      # In Progress → In Review when last child is In Review/Done
  on_all_children_done: true         # In Review → Done when every child is Done

coordinator_specifier_timeout_seconds: null
# How long coordinator polls for `state:strategy-approved` after spawning
# specifier in strict mode, before self-blocking with Status=Blocked.
# null = wait forever (current implicit behavior, preserved).
# Finite integer (e.g. 3600 = 1 hour) bounds the wait for unattended /orchestrate runs.

# === Topology B — /orchestrate concurrency ===
orchestrate_concurrency: 3

# === Worktree isolation (global default for the implementer) ===
# When enabled, the spawning command (/develop or coordinator under /orchestrate)
# spawns the implementer with `isolation: "worktree"`. For per-role control over
# ANY phase agent, set `phases.<role>.worktree: true` above — the same
# phase-tuning hook applies it, and either source enabling it → worktree.
worktree:
  enabled: true

# === Artifact paths — single source of truth ===
# Stack-co-located is preferred for new work. Cross-cutting / legacy paths still valid.
# Agents MUST read paths from this block — do NOT hardcode them in agent prompts.
artifact_paths:
  # Stack-co-located (preferred for new work):
  stack_root:     .ai-docs/stacks/<slug>/
  plan:           .ai-docs/stacks/<slug>/plan.yaml
  stack_research: .ai-docs/stacks/<slug>/<topic>.md
  stack_spec:     .ai-docs/stacks/<slug>/specs/<issue-key>.md

  # Design-loop (v2 — reference-driven iteration). Each surface gets its own
  # design root containing the reference (spec / figma-url / image), surface
  # declaration, and per-iteration grader screenshots.
  design_root:    .ai-docs/design/<surface-slug>/

  # Cross-cutting / legacy:
  cross_cutting_research: .ai-docs/research/<topic>.md
  legacy_spec:            .ai-docs/specs/<issue-key>.md

# === Tool groups — canonical tool bundles ===
# Each agent enumerates its actual tools in frontmatter; a `# tool_group: <name>`
# comment declares which group expands. Verify with `just sdlc::verify-tool-groups`.
tool_groups:
  # ALLOWLISTS — copy into `tools:` to restrict to exactly these (no MCP)
  read_only:        [Read, Glob, Grep]
  research:         [Read, Glob, Grep, WebFetch, WebSearch]
  research_writer:  [Read, Write, Glob, Grep, WebFetch, WebSearch]
  spec_writer:      [Read, Write, Edit, Glob, Grep]
  code_writer:      [Read, Write, Edit, Bash, Glob, Grep]
  validator:        [Read, Bash, Glob, Grep]

  # DENYLISTS — copy into `disallowedTools:` to inherit-all-minus (KEEPS MCP)
  no_egress:        [WebFetch, WebSearch]
  no_recursion:     [Agent]
  no_writes:        [Write, Edit]
  spec_writer_mcp:  [WebFetch, WebSearch, Agent]            # Bash kept — required by github adapter (`gh issue comment`, `gh issue edit`)
  code_writer_mcp:  [WebFetch, WebSearch, Agent]
  validator_mcp:    [Write, Edit, WebFetch, WebSearch, Agent]

# === Canvas registry ===
# Each canvas (template + instructions + schema + README) governs the shape of
# one artifact type. Project canvases at `.claude/canvases/<name>/` win over
# plugin canvases at `${CLAUDE_PLUGIN_DIR}/canvases/<name>/` (canvas-author
# writes to project path on edit — fork-on-edit).
#
# Family subfolders: canvases that share surface-specific parser rules live
# under `.claude/canvases/<family>/<name>/` with a `CONVENTIONS.md` next to
# them (e.g. github/ for GitHub-syntax-sensitive artifacts). Register them
# with the full family-prefixed path. See plugin/canvases/README.md
# "Family subfolders" section for the pattern + when to use it.
canvases:
  spec:               .claude/canvases/spec/           # producer: specifier; consumers: implementer, coordinator, validator, reviewer
  envelope:           .claude/canvases/envelope/       # cross-surface output wrapper; every phase agent emits
  plan:               .claude/canvases/plan/           # producer: planner; consumers: /sync-issues + downstream specifier
  session:            .claude/canvases/session/        # producers: every workflow command; two-tone observability
  quality-checks:     .claude/canvases/quality-checks/ # input to reviewer's lens=quality runs (Gate 2.5)

  # GitHub family — canvases sharing GitHub-syntax conventions (closing keywords,
  # [plan-key:] markers, sub-issue rollup). Authored in follow-up PRs; uncomment
  # the registry rows as each canvas lands.
  # github/pr-body:           .claude/canvases/github/pr-body/         # producer: implementer, specifier, docs-author; consumer: GitHub
  # github/issue-body:        .claude/canvases/github/issue-body/      # producer: /sync-issues, planner; consumer: GitHub
  # github/epic-body:         .claude/canvases/github/epic-body/       # producer: /sync-issues, planner; consumer: GitHub
